<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kara.ai Ultra</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b1020;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}

header{
  padding:15px;
  background:#111827;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1f2937;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.logo span{
  color:#22c55e;
}

.status{
  font-size:12px;
  color:#22c55e;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.msg{
  max-width:80%;
  padding:12px;
  border-radius:14px;
  animation:fade .25s ease;
  white-space:pre-wrap;
  line-height:1.5;
}

.user{
  align-self:flex-end;
  background:#2563eb;
}

.bot{
  align-self:flex-start;
  background:#1f2937;
}

.typing{
  opacity:0.7;
  font-style:italic;
}

.input-area{
  background:#111827;
  padding:10px;
  display:flex;
  gap:8px;
  border-top:1px solid #1f2937;
}

input{
  flex:1;
  border:none;
  border-radius:10px;
  padding:12px;
  outline:none;
  background:#1f2937;
  color:white;
}

button{
  border:none;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}

.send{
  background:#22c55e;
  color:white;
}

.clear{
  background:#ef4444;
  color:white;
}

.file{
  background:#f59e0b;
  color:white;
}

.voice{
  background:#8b5cf6;
  color:white;
}

.theme{
  background:#374151;
  color:white;
}

img.preview{
  max-width:100%;
  border-radius:12px;
  margin-top:8px;
}

.code{
  background:#0f172a;
  padding:10px;
  border-radius:8px;
  overflow:auto;
  margin-top:8px;
  font-family:monospace;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.dark{
  background:#f4f4f4;
  color:black;
}

.dark header,
.dark .input-area{
  background:white;
}

.dark .bot{
  background:#d1d5db;
  color:black;
}

.dark input{
  background:#e5e7eb;
  color:black;
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖 <span>Kara.ai Ultra</span></div>
  <div class="status" id="status">Online</div>
</header>

<div class="chat" id="chat"></div>

<div class="input-area">
  <button class="theme" onclick="toggleTheme()">🌙</button>
  <input id="input" placeholder="Ask Kara.ai anything..." />
  <button class="voice" onclick="startVoice()">🎤</button>
  <button class="file" onclick="fileInput.click()">📁</button>
  <button class="send" onclick="send()">Send</button>
  <button class="clear" onclick="clearChat()">Clear</button>
</div>

<input type="file" id="fileInput" hidden />

<script>
console.log("Kara.ai Ultra Loaded");
</script>

</body>
</html>
