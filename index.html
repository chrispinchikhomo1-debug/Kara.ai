<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kara.ai Pro</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}

header {
  padding:14px;
  text-align:center;
  background:#111827;
  font-weight:bold;
}

.title { color:#22c55e; }

.chat {
  flex:1;
  padding:12px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg {
  max-width:75%;
  padding:10px;
  border-radius:12px;
  white-space:pre-wrap;
}

.user { align-self:flex-end; background:#2563eb; }
.bot { align-self:flex-start; background:#1f2937; }

.input-area {
  display:flex;
  padding:10px;
  background:#111827;
  gap:6px;
}

input {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
}

button {
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.send { background:#22c55e; color:white; }
.file { background:#f59e0b; }
.clear { background:#ef4444; color:white; }

small {
  opacity:0.6;
}
</style>
</head>

<body>

<header>🤖 <span class="title">Kara.ai Pro</span></header>

<div class="chat" id="chat"></div>

<div class="input-area">
  <input id="input" placeholder="Ask Kara.ai..." />
  <button class="file" onclick="fileInput.click()">📁</button>
  <button class="send" onclick="send()">Send</button>
  <button class="clear" onclick="clearChat()">Clear</button>
</div>

<input type="file" id="fileInput" hidden />

<script>
const chat = document.getElementById("chat");
const fileInput = document.getElementById("fileInput");

let memory = JSON.parse(localStorage.getItem("kara_pro_memory") || "[]");
memory.forEach(m => render(m.text, m.type));

function save(text,type){
  memory.push({text,type});
  localStorage.setItem("kara_pro_memory", JSON.stringify(memory));
}

function render(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

/* ---------------- AI TOOL ENGINE ---------------- */

function detectTool(text){
  text = text.toLowerCase();

  if(text.startsWith("calc:")) return "calculator";
  if(text.includes("file:")) return "file";
  return "chat";
}

/* Calculator Tool */
function calculator(expr){
  try {
    return "Result: " + eval(expr);
  } catch {
    return "Invalid calculation";
  }
}

/* Smart fallback AI */
function fakeAI(text){
  const responses = [
    "I understand. Tell me more 🤔",
    "That’s interesting — here’s my thought: it depends.",
    "Let me think... that could have multiple answers.",
    "Good question 👍 I can help you explore it."
  ];
  return responses[Math.floor(Math.random()*responses.length)];
}

/* Main AI logic */
function getResponse(text){

  const tool = detectTool(text);

  if(tool === "calculator"){
    return calculator(text.replace("calc:",""));
  }

  if(tool === "file"){
    return "Upload a file to let me read it 📁";
  }

  /* Simple knowledge simulation */
  if(text.toLowerCase().includes("hello")){
    return "Hello 👋 I'm Kara.ai Pro";
  }

  if(text.toLowerCase().includes("who are you")){
    return "I'm Kara.ai Pro — a smart assistant with tools.";
  }

  return fakeAI(text);
}

/* ---------------- SEND ---------------- */

function send(){
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  render(text,"user");
  save(text,"user");

  const reply=getResponse(text);

  setTimeout(()=>{
    render(reply,"bot");
    save(reply,"bot");
  },500);

  input.value="";
}

/* ---------------- FILE READER ---------------- */

fileInput.addEventListener("change",(e)=>{
  const file=e.target.files[0];
  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(){
    const content=reader.result;
    render("File uploaded 📁","user");
    save("File uploaded","user");

    render("File content:

"+content,"bot");
    save("File content","bot");
  };

  reader.readAsText(file);
});

/* ---------------- CLEAR ---------------- */

function clearChat(){
  chat.innerHTML="";
  memory=[];
  localStorage.removeItem("kara_pro_memory");
}

/* Enter key */
document.getElementById("input").addEventListener("keypress",(e)=>{
  if(e.key==="Enter") send();
});

/* Welcome */
if(memory.length===0){
  render("Hi 👋 I'm Kara.ai Pro. Try:
- hello
- calc:2+2
- upload file","bot");
}
</script>

</body>
</html>
